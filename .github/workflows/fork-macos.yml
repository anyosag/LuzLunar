---
# LuzLunar build: this Moonlight fork for Apple Silicon Macs, signed with the LUZLUNAR_SIGNING_P12
# certificate, or ad-hoc without it (see scripts/fork/build-mac.sh).
# Upstream's build.yml (all platforms) is disabled on this fork.
name: LuzLunar - macOS (Apple Silicon)
permissions:
  contents: read

on:
  push:
    branches:
      - master
      - 'claude/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner. Upstream's default; macos-15 when GitHub is short of macOS 26 machines.
        type: choice
        options:
          - upstream
          - macos-15
        default: upstream
  # Used by sync-upstream.yml, since pushes made with GITHUB_TOKEN don't trigger workflows.
  workflow_call:
    inputs:
      ref:
        description: Commit to build (defaults to the commit that triggered the run)
        type: string
        default: ''

concurrency:
  group: fork-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Read upstream macOS toolchain
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.read.outputs.os }}
      qt_version: ${{ steps.read.outputs.qt_version }}
      aqtsource: ${{ steps.read.outputs.aqtsource }}
    steps:
      - name: Checkout workflows
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: .github/workflows
          persist-credentials: false

      # Follow upstream's macOS runner, Qt version and aqtinstall pin so Qt bumps don't need fork edits.
      - name: Read build-win-mac.yml
        id: read
        shell: bash
        env:
          RUNNER_OVERRIDE: ${{ inputs.runner }}
        run: |
          f=.github/workflows/build-win-mac.yml
          os=$(grep -oE 'os: macos-[0-9A-Za-z.-]+' "$f" | head -n1 | cut -d' ' -f2)
          qt=$(grep -A1 -E 'os: macos-' "$f" | grep -oE 'qt_version: [0-9.]+' | head -n1 | cut -d' ' -f2)
          aqt=$(grep -oE "aqtsource: '[^']+'" "$f" | head -n1 | sed -E "s/aqtsource: '(.*)'/\1/")
          # A manual run can pick another runner when GitHub has no macOS 26 machines free
          if [ -n "$RUNNER_OVERRIDE" ] && [ "$RUNNER_OVERRIDE" != "upstream" ]; then
            os=$RUNNER_OVERRIDE
          fi
          # Upstream pins aqtinstall to a commit. Falling back to whatever PyPI serves would install
          # an unpinned tool into the build, so stop instead.
          if [ -z "$aqt" ]; then
            echo "::error::Couldn't read aqtsource from $f; upstream may have changed its format. Update this step."
            exit 1
          fi
          echo "os=${os:-macos-26}" >> "$GITHUB_OUTPUT"
          echo "qt_version=${qt:-6.11.2}" >> "$GITHUB_OUTPUT"
          echo "aqtsource=$aqt" >> "$GITHUB_OUTPUT"
          echo "Using ${os:-macos-26}, Qt ${qt:-6.11.2}, $aqt"

  build:
    name: macOS arm64
    needs: setup
    runs-on: ${{ needs.setup.outputs.os }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          submodules: 'recursive'
          fetch-depth: 1
          persist-credentials: false

      # The macOS 26 SDK is needed for Liquid Glass and Icon Composer icons. Older runners have
      # Xcode 26 installed but not as the default.
      - name: Use Xcode 26 or later
        shell: bash
        run: |
          # Read the whole output first: xcodebuild crashes if a pipe closes early (head)
          version=$(xcodebuild -version)
          major=$(echo "$version" | grep -oE '[0-9]+' | head -n1)
          if [ "${major:-0}" -lt 26 ]; then
            xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n1)
            [ -n "$xcode" ] || { echo "::error::No Xcode 26 on this runner"; exit 1; }
            sudo xcode-select -s "$xcode"
          fi
          xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22

      - name: Install create-dmg
        run: npm install --global create-dmg@8.1.0

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125  # v4.4.1
        with:
          cache: true
          set-env: true
          add-tools-to-path: true
          version: ${{ needs.setup.outputs.qt_version }}
          aqtsource: ${{ needs.setup.outputs.aqtsource }}
          # The macOS Controls style draws BusyIndicator from an animated WebP, which needs the
          # qtimageformats plugin; macdeployqt then bundles it.
          modules: 'qtimageformats'

      # The run number orders builds for over-the-air updates (app/fork/forkupdater.cpp); only a push
      # to master is a master build, which updates may replace by themselves and the publish job releases.
      - name: Set version
        id: version
        shell: bash
        env:
          FORK_BUILD_RUN: ${{ github.run_number }}
          IS_MASTER_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          version="$(cat app/version.txt)-fork.$(git rev-parse --short=7 HEAD)"
          echo "CI_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "FORK_BUILD_RUN=$FORK_BUILD_RUN" >> "$GITHUB_ENV"
          if [ "$IS_MASTER_PUSH" = true ]; then
            echo "FORK_BUILD_CHANNEL=master" >> "$GITHUB_ENV"
          else
            echo "FORK_BUILD_CHANNEL=branch" >> "$GITHUB_ENV"
          fi

      - name: Fork unit tests
        shell: bash
        run: |
          python3 setup-deps.py
          clang++ -std=c++17 -Wall -Iapp -Ilibs/mac/include/SDL2 \
            tests/fork/keymap_test.cpp app/fork/forkkeymap.cpp -o "$RUNNER_TEMP/keymap_test"
          "$RUNNER_TEMP/keymap_test"
          # The fullscreen Space and screen-covering rules
          clang++ -std=c++17 -Wall -Wextra -Iapp \
            tests/fork/policy_test.cpp app/fork/forkpolicy.cpp -o "$RUNNER_TEMP/policy_test"
          "$RUNNER_TEMP/policy_test"
          # The stream warnings for this Mac's hardware and the aspect ratio names
          clang++ -std=c++17 -Wall -Wextra -Iapp \
            tests/fork/hwrules_test.cpp app/fork/forkhwrules.cpp -o "$RUNNER_TEMP/hwrules_test"
          "$RUNNER_TEMP/hwrules_test"
          # What the host is told about the Mac screen, for Apollo's virtual display
          clang++ -std=c++17 -Wall -Wextra -Iapp \
            tests/fork/clientdisplay_test.cpp app/fork/clientdisplay.cpp -o "$RUNNER_TEMP/clientdisplay_test"
          "$RUNNER_TEMP/clientdisplay_test"
          # The aspect ratio picker's sizes, the aspect lock and even rounding
          clang++ -std=c++17 -Wall -Wextra -Iapp \
            tests/fork/aspect_test.cpp app/fork/forkaspect.cpp -o "$RUNNER_TEMP/aspect_test"
          "$RUNNER_TEMP/aspect_test"
          # Which Mac shortcuts stream capture takes, and that it gives back exactly those
          clang++ -std=c++17 -Wall -Wextra -Iapp \
            tests/fork/macshortcuts_test.cpp app/fork/forkmacshortcuts.cpp -o "$RUNNER_TEMP/macshortcuts_test"
          "$RUNNER_TEMP/macshortcuts_test"
          # The clipboard bundle, shared with anyosag/Apollo (the same test runs in its CI)
          clang++ -std=c++17 -Wall -Wextra -DCLIPBUNDLE_WITH_ZLIB -Iapp/fork \
            tests/fork/clipbundle_test.cpp app/fork/clipbundle.cpp -lz -o "$RUNNER_TEMP/clipbundle_test"
          "$RUNNER_TEMP/clipbundle_test"
          # File copies through the clipboard: a Finder copy walked and read in chunks, a copy from the PC
          # written into the cache, and old copies cleared
          clang++ -std=c++17 -Wall -Wextra -DCLIPBUNDLE_WITH_ZLIB -Iapp/fork \
            tests/fork/clipfiles_test.cpp app/fork/clipfiles.cpp app/fork/clipbundle.cpp -lz -o "$RUNNER_TEMP/clipfiles_test"
          "$RUNNER_TEMP/clipfiles_test"
          # The notch bar's link badge: its text, when it shows, and the networks remembered
          clang++ -std=c++17 -Wall -Wextra -Iapp \
            tests/fork/forklinkrules_test.cpp app/fork/forklinkrules.cpp -o "$RUNNER_TEMP/forklinkrules_test"
          "$RUNNER_TEMP/forklinkrules_test"
          # The fork's SDL event types are never SDL_USEREVENT, which Moonlight's session uses as is
          clang++ -std=c++17 -Wall -Wextra -Iapp \
            tests/fork/forkevents_test.cpp -o "$RUNNER_TEMP/forkevents_test"
          "$RUNNER_TEMP/forkevents_test"
          # This Mac as a drive on the PC: the shares asked for, when a stream asks, and Apollo's answers
          clang++ -std=c++17 -Wall -Wextra -Iapp \
            tests/fork/macdriverules_test.cpp app/fork/macdriverules.cpp -o "$RUNNER_TEMP/macdriverules_test"
          "$RUNNER_TEMP/macdriverules_test"
          # How evenly the PC sends frames: the score, its window, what breaks it, and Even or Uneven
          clang++ -std=c++17 -Wall -Wextra -Iapp \
            tests/fork/hostcadence_test.cpp -o "$RUNNER_TEMP/hostcadence_test"
          "$RUNNER_TEMP/hostcadence_test"
          # The notch bar's menus: keyboard movement and the items right of the notch
          clang++ -std=c++17 -Wall -Wextra -Iapp \
            tests/fork/notchmenus_test.cpp -o "$RUNNER_TEMP/notchmenus_test"
          "$RUNNER_TEMP/notchmenus_test"
          # Stream status's latency in four parts and the last two minutes of it
          clang++ -std=c++17 -Wall -Wextra -Iapp \
            tests/fork/streamhistory_test.cpp -o "$RUNNER_TEMP/streamhistory_test"
          "$RUNNER_TEMP/streamhistory_test"
          # Stream status's graph scale, summary, latency bar, pointer, health and the bar item's text
          clang++ -std=c++17 -Wall -Wextra -Iapp \
            tests/fork/notchstatus_test.cpp -o "$RUNNER_TEMP/notchstatus_test"
          "$RUNNER_TEMP/notchstatus_test"
          # Adaptive bitrate's controller: cuts on losses and queues, holds, the climb back, the floor,
          # turned on below the user's bitrate, and why it last changed it
          clang++ -std=c++17 -Wall -Wextra -Iapp \
            tests/fork/bitraterules_test.cpp app/fork/bitraterules.cpp -o "$RUNNER_TEMP/bitraterules_test"
          "$RUNNER_TEMP/bitraterules_test"
          # What the PC's answers say about changing the bitrate during the stream
          clang++ -std=c++17 -Wall -Wextra -Iapp \
            tests/fork/bitratestate_test.cpp -o "$RUNNER_TEMP/bitratestate_test"
          "$RUNNER_TEMP/bitratestate_test"
          # The notch bar's Quality menu: its line, caption, "ago" and the slider's range and steps
          clang++ -std=c++17 -Wall -Wextra -Iapp \
            tests/fork/notchquality_test.cpp -o "$RUNNER_TEMP/notchquality_test"
          "$RUNNER_TEMP/notchquality_test"
          # The notch bar's battery: its glyph, Battery's texts, Stream Battery Saver and the Low Power Mode message
          clang++ -std=c++17 -Wall -Wextra -Iapp \
            tests/fork/powerrules_test.cpp -o "$RUNNER_TEMP/powerrules_test"
          "$RUNNER_TEMP/powerrules_test"
          # Reconnecting from the notch bar: the new stream's settings, Quality's frame rates and resolutions
          clang++ -std=c++17 -Wall -Wextra -Iapp \
            tests/fork/reconnectrules_test.cpp -o "$RUNNER_TEMP/reconnectrules_test"
          "$RUNNER_TEMP/reconnectrules_test"
          # The notch bar's Stream Settings: presets, what changed, what reconnects
          clang++ -std=c++17 -Wall -Wextra -Iapp \
            tests/fork/streamsettingsrules_test.cpp -o "$RUNNER_TEMP/streamsettingsrules_test"
          "$RUNNER_TEMP/streamsettingsrules_test"
          # Trackpad passthrough frames, also shared with anyosag/Apollo (the same test runs in its CI)
          clang++ -std=c++17 -Wall -Wextra -Iapp/fork \
            tests/fork/luztouchpad_test.cpp -o "$RUNNER_TEMP/luztouchpad_test"
          "$RUNNER_TEMP/luztouchpad_test"
          # Trackpad passthrough: Mac touches to frames with palms left out, Mac trackpad mode, and
          # which trackpad mouse events are held back
          clang++ -std=c++17 -Wall -Wextra -Iapp/fork \
            tests/fork/trackpad_test.cpp app/fork/forktrackpad.cpp -o "$RUNNER_TEMP/trackpad_test"
          "$RUNNER_TEMP/trackpad_test"
          # Palm rejection's contact sizes: MultitouchSupport's contacts paired with AppKit's touches
          clang++ -std=c++17 -Wall -Wextra -Iapp/fork \
            tests/fork/multitouch_test.cpp app/fork/forkmultitouch.cpp -o "$RUNNER_TEMP/multitouch_test"
          "$RUNNER_TEMP/multitouch_test"
          # Which Dock gestures it holds back, and the System Settings values it puts back after a crash
          clang++ -std=c++17 -Wall -Wextra -Iapp/fork \
            tests/fork/trackpadgestures_test.cpp app/fork/forktrackpadgestures.cpp -o "$RUNNER_TEMP/trackpadgestures_test"
          "$RUNNER_TEMP/trackpadgestures_test"
          # Over-the-air updates: manifests, when they install, and the Ed25519 check (Homebrew's OpenSSL)
          openssl_prefix=$(brew --prefix openssl@3)
          clang++ -std=c++17 -Wall -Wextra -Iapp/fork -I"$openssl_prefix/include" \
            tests/fork/updaterules_test.cpp app/fork/forkupdaterules.cpp \
            -L"$openssl_prefix/lib" -lcrypto -o "$RUNNER_TEMP/updaterules_test"
          "$RUNNER_TEMP/updaterules_test"
          # The probe for checking passthrough on a Mac (uploaded below); built here so it keeps building
          mkdir -p "$RUNNER_TEMP/probe"
          clang++ -std=c++17 -fobjc-arc -Wall -Iapp/fork -framework AppKit -framework ApplicationServices \
            scripts/fork/trackpad-probe.mm app/fork/forktrackpadgestures.cpp app/fork/forkmultitouch.cpp \
            -o "$RUNNER_TEMP/probe/trackpad-probe"
          # The Mac pasteboard in the bundle's formats, on a private pasteboard
          clang++ -std=c++17 -Wall -DCLIPBUNDLE_WITH_ZLIB -Iapp \
            tests/fork/pasteboard_test.mm app/fork/mac/pasteboard_mac.mm app/fork/clipbundle.cpp \
            -framework AppKit -framework ImageIO -lz -o "$RUNNER_TEMP/pasteboard_test"
          "$RUNNER_TEMP/pasteboard_test"
          # The interface, speed and network of the route to an address on this Mac, with nothing sent
          clang++ -std=c++17 -Wall -Wextra -Iapp \
            tests/fork/networklink_mac_test.mm app/fork/mac/networklink_mac.mm app/fork/forklinkrules.cpp \
            -framework Foundation -framework SystemConfiguration -framework CoreWLAN -o "$RUNNER_TEMP/networklink_mac_test"
          "$RUNNER_TEMP/networklink_mac_test"
          # The Mac drive's macOS side on the CI Mac: the account, File Sharing, its shares, and a keychain item
          clang++ -std=c++17 -Wall -Wextra -Iapp \
            tests/fork/macdrivesetup_mac_test.mm app/fork/mac/macdrivesetup_mac.mm \
            -framework Foundation -framework AppKit -framework OpenDirectory -framework Security \
            -framework SystemConfiguration -o "$RUNNER_TEMP/macdrivesetup_mac_test"
          "$RUNNER_TEMP/macdrivesetup_mac_test"

      # Stream profiles give each Session its own StreamingPreferences copy. Streaming code that
      # reads the global settings directly would bypass the profile, so flag any new such read.
      - name: Check streaming code uses the session's preferences
        shell: bash
        run: |
          reads=$(grep -rn "StreamingPreferences::get()" app/streaming | grep -v "app/streaming/session.cpp:.*m_Preferences(preferences ? preferences : StreamingPreferences::get())" || true)
          if [ -n "$reads" ]; then
            echo "::warning::Streaming code reads the global StreamingPreferences, bypassing per-app stream profiles:"
            echo "$reads"
          fi

      # A self-signed certificate (secret LUZLUNAR_SIGNING_P12, a base64 .p12, and
      # LUZLUNAR_SIGNING_P12_PASSWORD) gives every build the same signing identity, so macOS keeps
      # the Accessibility permission (trackpad passthrough's gesture blocker) across updates. Without
      # the secret, as in pull requests from other repositories, the app is signed ad-hoc.
      - name: Import the signing certificate
        shell: bash
        env:
          P12: ${{ secrets.LUZLUNAR_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.LUZLUNAR_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::No LUZLUNAR_SIGNING_P12 secret, so this build is signed ad-hoc and Accessibility must be granted again after installing it"
            exit 0
          fi
          keychain="$RUNNER_TEMP/luzlunar-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          # Let codesign use the key without a prompt
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # Search the new keychain too, keeping the existing ones
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | sed -e 's/^ *"//' -e 's/"$//')
          # A self-signed certificate isn't trusted, so it's listed without -v (valid only)
          identity=$(security find-identity -p codesigning "$keychain" | grep -oE '[0-9A-F]{40}' | head -n1)
          if [ -z "$identity" ]; then
            echo "::error::The LUZLUNAR_SIGNING_P12 certificate has no code-signing identity"
            exit 1
          fi
          echo "LUZLUNAR_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "LUZLUNAR_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "Signing with certificate $identity"

      - name: Build (arm64)
        run: bash scripts/fork/build-mac.sh Release

      - name: Remove the signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "$LUZLUNAR_SIGN_KEYCHAIN" ]; then
            security delete-keychain "$LUZLUNAR_SIGN_KEYCHAIN" || true
          fi

      - name: Upload DMG
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: LuzLunar-macOS-arm64-${{ env.CI_VERSION }}
          path: build/installer-Release/*.dmg
          compression-level: 0
          if-no-files-found: error

      # The signed app zipped for over-the-air updates (build-mac.sh); the publish job releases it
      - name: Upload the update zip
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: LuzLunar-update-${{ env.CI_VERSION }}
          path: build/installer-Release/LuzLunar-macOS-arm64.zip
          compression-level: 0
          if-no-files-found: error

      - name: Upload Symbols
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: zDevDbgSyms-LuzLunar-macOS-arm64-${{ env.CI_VERSION }}
          path: build/installer-Release/*.dsym/*
          if-no-files-found: error

      # scripts/fork/trackpad-probe.mm, built in the unit test step
      - name: Upload the trackpad probe
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: LuzLunar-trackpad-probe-${{ env.CI_VERSION }}
          path: ${{ runner.temp }}/probe/trackpad-probe
          if-no-files-found: warn

      # Screenshots of the main views and dialogs in dark and light mode, taken by the app itself
      # (app/fork/screenshotharness.cpp), so UI changes can be reviewed without a Mac.
      - name: UI screenshots
        shell: bash
        continue-on-error: true
        run: |
          app=build/build-Release/app/LuzLunar.app/Contents/MacOS/LuzLunar
          for scheme in dark light; do
            LUZLUNAR_SCREENSHOTS="$RUNNER_TEMP/screenshots/$scheme" LUZLUNAR_SCREENSHOT_SCHEME=$scheme \
              perl -e 'alarm 120; exec @ARGV' "$app" || echo "::warning::Screenshot run ($scheme) exited with status $?"
          done
          # The app icon as older macOS shows it (actool's flattened .icns)
          sips -s format png build/build-Release/app/LuzLunar.app/Contents/Resources/LuzLunar.icns --out "$RUNNER_TEMP/screenshots/app-icon.png" || true
          ls -R "$RUNNER_TEMP/screenshots" || true

      - name: Upload UI screenshots
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: LuzLunar-screenshots-${{ env.CI_VERSION }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn

  # Over-the-air updates (FORK.md, "Updates"): each master build becomes a GitHub release with an
  # update.json that LuzLunar checks against the public key in app/fork/updatekey.h. The signing
  # key is the FORK_UPDATE_KEY secret of the `release` environment, which only master may use.
  publish:
    name: Publish update
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write  # create the release
    concurrency:
      group: publish-update
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          sparse-checkout: app/fork/updatekey.h
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the update zip
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: LuzLunar-update-${{ needs.build.outputs.version }}
          path: artifacts

      - name: Download the DMG
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: LuzLunar-macOS-arm64-${{ needs.build.outputs.version }}
          path: artifacts

      - name: Write and sign update.json
        id: sign
        env:
          FORK_UPDATE_KEY: ${{ secrets.FORK_UPDATE_KEY }}
          RUN: ${{ github.run_number }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -z "$FORK_UPDATE_KEY" ]; then
            echo "::warning::The release environment has no FORK_UPDATE_KEY secret, so this build isn't published as an update (FORK.md, \"Updates\")"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd artifacts
          file=LuzLunar-macOS-arm64.zip
          tag="luzlunar-b$RUN"
          notes="${HEAD_MESSAGE%%$'\n'*}"
          notes="${notes:0:500}"
          jq -n \
            --argjson run "$RUN" --arg version "$VERSION" --arg commit "$COMMIT" \
            --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg notes "$notes" \
            --arg name "$file" --arg url "https://github.com/$REPO/releases/download/$tag/$file" \
            --arg sha256 "$(sha256sum "$file" | cut -d' ' -f1)" --argjson size "$(stat -c %s "$file")" \
            '{product: "luzlunar", channel: "master", run: $run, version: $version, commit: $commit,
              published: $published, notes: $notes,
              asset: {name: $name, url: $url, sha256: $sha256, size: $size}}' > update.json
          cat update.json

          key="$RUNNER_TEMP/update-key.pem"
          (umask 077; printf '%s\n' "$FORK_UPDATE_KEY" > "$key")
          openssl pkeyutl -sign -inkey "$key" -rawin -in update.json -out "$RUNNER_TEMP/update.sig"
          rm -f "$key"
          base64 -w0 "$RUNNER_TEMP/update.sig" > update.json.sig

          # The secret must match the public key LuzLunar has, or every LuzLunar would refuse this update
          hex=$(grep -o '0x[0-9a-f][0-9a-f]' ../app/fork/updatekey.h | head -n 32 | sed 's/0x//' | tr -d '\n')
          { echo '-----BEGIN PUBLIC KEY-----'; echo "302a300506032b6570032100$hex" | xxd -r -p | base64; echo '-----END PUBLIC KEY-----'; } > "$RUNNER_TEMP/update-pub.pem"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/update-pub.pem" -rawin -in update.json -sigfile "$RUNNER_TEMP/update.sig"

          {
            echo "publish=true"
            echo "tag=$tag"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"

      - name: Create the release
        if: steps.sign.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.sign.outputs.tag }}
          NOTES: ${{ steps.sign.outputs.notes }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd artifacts
          files=(LuzLunar-macOS-arm64.zip LuzLunar-*.dmg update.json update.json.sig)
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber "${files[@]}"
          else
            gh release create "$TAG" --repo "$REPO" --target "$COMMIT" --title "LuzLunar $VERSION" \
              --notes "$NOTES" --latest "${files[@]}"
          fi

          # Keep the newest 15 updates
          gh release list --repo "$REPO" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("luzlunar-b"))] | sort_by(.createdAt) | reverse | .[15:] | .[].tagName' |
          while read -r old; do
            echo "Removing $old"
            gh release delete "$old" --repo "$REPO" --yes --cleanup-tag
          done
