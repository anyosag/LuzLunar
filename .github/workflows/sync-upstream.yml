---
# Once a day, merges new commits from moonlight-stream/moonlight-qt into the upstream-sync branch,
# opens (or updates) a pull request from it into master, and builds the macOS app from the merge.
# Nothing reaches master until that pull request is merged, so upstream changes get a look first.
#
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
#
# Upstream sometimes changes .github/workflows, and GITHUB_TOKEN may not push those changes.
# Add a fine-grained token with Contents, Workflows and Pull requests read/write on this repo as
# the SYNC_TOKEN secret to sync them too. Pull requests opened with it also run fork-macos.yml.
name: Sync upstream

on:
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:
    inputs:
      build:
        description: Build the app even if upstream has no new commits
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/moonlight-stream/moonlight-qt.git
  SYNC_BRANCH: upstream-sync

jobs:
  sync:
    name: Merge upstream master
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the sync branch
      pull-requests: write  # open the sync pull request
      actions: write  # keep this schedule enabled
    outputs:
      updated: ${{ steps.merge.outputs.updated }}
      sha: ${{ steps.merge.outputs.sha }}
      has_pat: ${{ steps.merge.outputs.has_pat }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream
        id: merge
        env:
          HAS_PAT: ${{ secrets.SYNC_TOKEN != '' }}
        run: |
          echo "has_pat=$HAS_PAT" >> "$GITHUB_OUTPUT"
          git fetch --quiet "$UPSTREAM" master
          upstream=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor "$upstream" HEAD; then
            echo "master already contains upstream $(git rev-parse --short "$upstream")."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Already proposed: the sync branch has this upstream commit on top of today's master
          if git rev-parse --quiet --verify "origin/$SYNC_BRANCH" > /dev/null &&
             git merge-base --is-ancestor "$upstream" "origin/$SYNC_BRANCH" &&
             git merge-base --is-ancestor HEAD "origin/$SYNC_BRANCH"; then
            echo "$SYNC_BRANCH already has upstream $(git rev-parse --short "$upstream") on top of master."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse "origin/$SYNC_BRANCH")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New upstream commits:"
          git log --oneline HEAD.."$upstream"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          if ! git merge --no-edit -m "Merge upstream moonlight-stream/moonlight-qt master" "$upstream"; then
            git diff --name-only --diff-filter=U
            echo "::error::Upstream changes conflict with this fork's changes in the files above. Merge $UPSTREAM master into a branch from master by hand and open a pull request (see FORK.md)."
            exit 1
          fi
          # The branch is rebuilt from master each time, so it's replaced rather than added to,
          # but only if nobody else pushed to it since checkout
          expected=$(git rev-parse --quiet --verify "origin/$SYNC_BRANCH" || true)
          if ! git push --force-with-lease="$SYNC_BRANCH:$expected" origin "HEAD:refs/heads/$SYNC_BRANCH"; then
            if git diff --name-only HEAD^1 HEAD -- .github/workflows | grep -q .; then
              echo "::error::Upstream changed .github/workflows, which GITHUB_TOKEN can't push. Add a SYNC_TOKEN secret (see the comment at the top of this file) or merge manually."
            fi
            exit 1
          fi

          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.merge.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          HAS_PAT: ${{ steps.merge.outputs.has_pat }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/pr-body.md"
          {
            echo "Merges new commits from [moonlight-stream/moonlight-qt](https://github.com/moonlight-stream/moonlight-qt) master."
            echo
            if [ "$HAS_PAT" = "true" ]; then
              echo "The macOS app for this merge is built by this pull request's checks."
            else
              echo "The macOS app for this merge is built by [the sync run]($RUN_URL); pull requests opened by GitHub Actions don't start the usual checks."
            fi
            echo
            echo "Look over the upstream changes, then merge with **Create a merge commit** (not squash or rebase) so master keeps upstream's history. Don't push to \`$SYNC_BRANCH\`: the next sync replaces it."
            echo
            echo "### New upstream commits"
            echo
            echo '```'
            git log --oneline --no-decorate HEAD^1..HEAD^2 | head -n 200
            echo '```'
          } > "$body"

          number=$(gh pr list --head "$SYNC_BRANCH" --base master --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$body"
          elif ! gh pr create --base master --head "$SYNC_BRANCH" --title "Merge upstream moonlight-stream/moonlight-qt" --body-file "$body"; then
            echo "::error::Couldn't open the pull request. Turn on Settings > Actions > General > \"Allow GitHub Actions to create and approve pull requests\", or open one from $SYNC_BRANCH by hand."
            exit 1
          fi

      # GitHub disables scheduled workflows in public repos after 60 days without activity.
      - name: Keep schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/sync-upstream.yml/enable"

  build:
    name: Build app
    needs: sync
    # A pull request opened with SYNC_TOKEN already runs fork-macos.yml, so only build here otherwise.
    if: (needs.sync.outputs.updated == 'true' && needs.sync.outputs.has_pat != 'true') || inputs.build
    uses: ./.github/workflows/fork-macos.yml
    # fork-macos.yml's publish job asks for contents: write, and GitHub refuses to start a run whose
    # called workflow asks for more than the caller grants, even for a job it would skip: every sync
    # failed at startup from 2026-10-19 until this. Publish runs only on a push to master, never here.
    permissions:
      contents: write
    # The signing certificate, so builds of the sync keep the app's permissions
    secrets: inherit
    with:
      ref: ${{ needs.sync.outputs.sha }}
